<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="12" fill="url(#p3Grad)"/>
  <!-- Weather App frame -->
  <rect x="50" y="40" width="500" height="270" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="50" y="40" width="500" height="35" rx="8" fill="#e2e8f0"/>
  <!-- Window dots -->
  <circle cx="70" cy="58" r="5" fill="#ef4444"/>
  <circle cx="85" cy="58" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="58" r="5" fill="#10b981"/>
  <!-- Sun & Cloud -->
  <circle cx="160" cy="140" r="35" fill="#fbbf24"/>
  <ellipse cx="200" cy="160" rx="40" ry="25" fill="#e2e8f0"/>
  <ellipse cx="230" cy="155" rx="30" ry="20" fill="#e2e8f0"/>
  <ellipse cx="180" cy="165" rx="25" ry="15" fill="#e2e8f0"/>
  <!-- Temperature & details -->
  <text x="320" y="145" font-family="sans-serif" font-size="42" font-weight="bold" fill="#1e293b">+24°C</text>
  <text x="325" y="175" font-family="sans-serif" font-size="16" fill="#64748b">თბილისი, მზიანი</text>
  <!-- Mini forecast cards -->
  <rect x="80" y="210" width="80" height="50" rx="6" fill="#fef3c7"/>
  <rect x="180" y="210" width="80" height="50" rx="6" fill="#fef3c7"/>
  <rect x="280" y="210" width="80" height="50" rx="6" fill="#fef3c7"/>
  <rect x="380" y="210" width="80" height="50" rx="6" fill="#fef3c7"/>
  <text x="300" y="295" font-family="sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Interactive Weather Dashboard</text>
</svg>
