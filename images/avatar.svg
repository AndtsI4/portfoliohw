  <!-- Glasses -->
  <rect x="118" y="115" width="28" height="20" rx="6" fill="none" stroke="#0f172a" stroke-width="3" />
  <rect x="154" y="115" width="28" height="20" rx="6" fill="none" stroke="#0f172a" stroke-width="3" />
  <line x1="146" y1="123" x2="154" y2="123" stroke="#0f172a" stroke-width="3" />
